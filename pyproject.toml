[project]
name = "nanoserve"
version = "0.1.0"
description = "Train a small LLM, then build the distributed system that serves it."
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["model", "engine", "bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repo root, so `import engine` resolves without installing the package.
# Without this, bare `pytest` fails to collect every test while
# `python -m pytest` passes -- the latter puts the cwd on sys.path and the
# former does not. That difference hid this bug locally for months: the dev
# venv had an editable install, so nothing ever exercised the bare path.
pythonpath = ["."]
addopts = "-q"
# asyncio tests are marked with pytestmark at module level; "auto" lets them
# run without decorating every function.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
